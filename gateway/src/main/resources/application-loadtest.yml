spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
        response-timeout: 5s
        pool:
          max-connections: 4000
          acquire-timeout: 1000

server:
  netty:
    connection-timeout: 5s

management:
  tracing:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.earlybird: WARN
    org.hibernate: WARN
  config: classpath:logback-loadtest.xml