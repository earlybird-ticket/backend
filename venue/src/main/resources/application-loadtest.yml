spring:
  datasource:
    hikari:
      maximum-pool-size: 40
      max-lifetime: 1800000
      minimum-idle: 8
      idle-timeout: 600000
      connection-timeout: 1500

server:
  tomcat:
    threads:
      max: 300
      min-spare: 20
    accept-count: 1000
    max-connections: 2000
    connection-timeout: 3s
    keep-alive-timeout: 5s
    max-keep-alive-requests: 50

management:
  tracing:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.earlybird: WARN
    org.hibernate: WARN
  config: classpath:logback-loadtest.xml