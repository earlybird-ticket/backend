server:
  port: 18086
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 32
      min-spare: 8
    accept-count: 200
    max-connections: 3000
    connection-timeout: 5s
    keep-alive-timeout: 5s

spring:
  application:
    name: venue-service
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    property-naming-strategy: SNAKE_CASE
  jpa:
    hibernate:
      default_batch_fetch_size: 0
      query:
        in_clause_parameter_padding: false
      ddl-auto: update
    #    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        format_sql: false
    open-in-view: false
  datasource:
    hikari:
      maximum-pool-size: 32
      max-lifetime: 1800000
      minimum-idle: 8
      idle-timeout: 600000
      connection-timeout: 3000
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_VENUE_PORT:15006}/${POSTGRES_DB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT_2}

  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    locations: classpath:db/migration/local
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    hostname: ${spring.application.name}
    metadataMap:
      prometheus.scrape: "true"
      prometheus.path: "/actuator/prometheus"
      prometheus.port: "${server.port}"
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:18080}/eureka

management:
  endpoints:
    jmx:
      exposure:
        include: prometheus
    web:
      exposure:
        include: refresh,health,beans,busrefresh,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        all: true
    enable:
      jvm: true
#  zipkin:
#    tracing:
#      endpoint: "http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans"
#  tracing:
#    sampling:
#      probability: ${ZIPKIN_SAMPLING_PROBABILITY:1.0}
  prometheus:
    metrics:
      export:
        enabled: true


api:
  connection-timeout: 3000
  read-timeout: 120000
  max-buffer-size-MB: 300