spring:
  application:
    name: reservation-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    hikari:
      maximum-pool-size: 40
      max-lifetime: 1800000
      minimum-idle: 8
      idle-timeout: 600000
      connection-timeout: 2000
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_RESERVATION_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    #    show-sql: true
    open-in-view: false

server:
  port: ${RESERVATION_SERVER_PORT:18088}
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: 160
      min-spare: 20
    accept-count: 400
    max-connections: 1200
    connection-timeout: 5s
    keep-alive-timeout: 10s
    max-keep-alive-requests: 100


management:
  endpoints:
    jmx:
      exposure:
        include: prometheus
    web:
      exposure:
        include: refresh,health,beans,busrefresh,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        all: true
    enable:
      jvm: true
  #  zipkin:
  #    tracing:
  #      endpoint: "http://${ZIPKIN_HOST:localhost}:${ZIPKIN_PORT:9411}/api/v2/spans"
  #  tracing:
  #    sampling:
  #      probability: ${ZIPKIN_SAMPLING_PROBABILITY:1.0}
  prometheus:
    metrics:
      export:
        enabled: true


eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:18080}/eureka
    registry-fetch-interval-seconds: 10
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true
    ip-address: ${RESERVATION_IP_ADDRESS}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
