spring:
  datasource:
    hikari:
      maximum-pool-size: 24
      max-lifetime: 1800000
      minimum-idle: 6
      idle-timeout: 600000
      connection-timeout: 1000

server:
  tomcat:
    threads:
      max: 160
      min-spare: 20
    accept-count: 300
    max-connections: 1000
    connection-timeout: 3s
    keep-alive-timeout: 5s
    max-keep-alive-requests: 50

api:
  connection-timeout: 1000
  read-timeout: 5000
  max-buffer-size-MB: 20

management:
  tracing:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.earlybird: WARN
    org.hibernate: WARN
  config: classpath:logback-loadtest.xml