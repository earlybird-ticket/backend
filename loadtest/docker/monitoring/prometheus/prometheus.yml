global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'spring-boot-apps'
    metrics_path: '/actuator/prometheus'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/apps-*.json'

  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis-exporter:9121' ]
        labels:
          service: 'redis'
          layer: 'middleware'

  - job_name: 'kafka'
    static_configs:
      - targets: [ 'kafka-exporter:9308' ]
        labels:
          service: 'kafka'
          layer: 'middleware'

  - job_name: 'node-exporter'
    file_sd_configs:
      - files:
        - '/etc/prometheus/targets/node-*.json'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: [ 'postgres-exporter-reservation:9187' ]
        labels:
          service: 'reservation'
          db_role: 'postgres'

      - targets: [ 'postgres-exporter-payment:9187' ]
        labels:
          service: 'payment'
          db_role: 'postgres'

      - targets: [ 'postgres-exporter-venue:9187' ]
        labels:
          service: 'venue'
          db_role: 'postgres'